How Web Works Exercise

Part One: Solidify Terminology
In your own terms, define the following terms:

- What is HTTP? 
// It stands for "Hyper Text Transfer Protocol" and serves as a rulebook for how to send and recieve content (like gifs and websites) over the internet.

- What is a URL? 
// It is the unique address for a specific page or file, URL stands for "Uniform Resource Locator".

- What is DNS? 
// Stands for "Domain Name System" that converts web names into numeric IP addresses that the computer uses to look up and load websites.

- What is a query string? 
// Its part of a URL that passes data between a website to a web server.

- What are two HTTP verbs and how are they different? 
// Examples include GET and POST; GET reads data from a server without modifiying it while POST sends/updates data to a server and thus changes it.

- What is an HTTP request? 
// A type of message sent from a website or app to a server, while using encryption protocols to protect the data it contains.

- What is an HTTP response? 
// A reply done after a HTTP request that brings back requested data, including a status code that confirms if ot was successful or not.

- What is an HTTP header? Give a couple examples of request and response headers you have seen. 
// It is text-based data that lets the client and the server pass extra information alongside a network request or response.

- What are the processes that happen when you type “http://somesite.com/some/page.html” into a browser?
// The browser uses DNS to convert the site address/name into an IP address, it makes a HTTP reply to a server, the server then does a HTTP response (which usually is HTML data), the browser then responds by making a DOM from the HTML provided and uses that DOM to find content needed for it (images, Javascript, CSS, etc.), and lastly the browser finishes rendering and displaying the webpage you inputed.

-->
